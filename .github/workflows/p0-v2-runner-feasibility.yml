name: P0 v2 runner feasibility Gate 1

on:
  pull_request:
    types:
      - ready_for_review
      - reopened
      - labeled

permissions: {}

concurrency:
  group: p0-v2-runner-feasibility-global
  cancel-in-progress: false

jobs:
  discovery:
    if: >-
      github.repository == 'yurikuchumov-ux/ai-operating-system' &&
      github.repository_id == '1296950956' &&
      github.event_name == 'pull_request' &&
      github.ref == 'refs/pull/71/merge' &&
      github.run_attempt == 1 &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'p0-v2-discovery' &&
      github.event.pull_request.number == 71 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == 'yurikuchumov-ux/ai-operating-system' &&
      github.event.pull_request.head.ref == 'agent/issue-70-p0-v2-feasibility-gate1' &&
      github.event.pull_request.base.repo.full_name == 'yurikuchumov-ux/ai-operating-system' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == 'd4f10b714de3afae84d48dfcd3daa6405092a973' &&
      github.event.sender.login == 'yurikuchumov-ux' &&
      github.event.sender.id == 299144523 &&
      github.actor == 'yurikuchumov-ux' &&
      github.actor_id == '299144523'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_REPOSITORY: yurikuchumov-ux/ai-operating-system
      EXPECTED_REPOSITORY_ID: "1296950956"
      EXPECTED_PR_NUMBER: "71"
      EXPECTED_EVENT_NAME: pull_request
      EXPECTED_EVENT_ACTION: labeled
      EXPECTED_EVENT_REF: refs/pull/71/merge
      EXPECTED_LABEL: p0-v2-discovery
      EXPECTED_SENDER_LOGIN: yurikuchumov-ux
      EXPECTED_SENDER_ID: "299144523"
      EXPECTED_ACTOR_LOGIN: yurikuchumov-ux
      EXPECTED_ACTOR_ID: "299144523"
      EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_MERGE_SHA: ${{ github.sha }}
      EXPECTED_BASE_SHA: d4f10b714de3afae84d48dfcd3daa6405092a973
      EXPECTED_WORKFLOW_PATH: .github/workflows/p0-v2-runner-feasibility.yml
      EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_PROBE_SHA256: eab4fc2c2cc226d43712cb599f79c014a57410ba1bcf775a461b21b0ea671a35
      EXPECTED_SCHEMA_SHA256: fbc9d66c7dd1f6b88ba9dc62b37546aea43fb2eb60e1f77c9409a722cb8bece9
      EXPECTED_TEST_SHA256: fc38500a7c0484ba4c73c3f37873942f35044db2765f241fb7fe4b4818186527
      EXPECTED_DISCOVERY_SCHEMA_SHA256: e4d1f6c329629afcb37d19b7005f9138937db626a9dcfefd202771724023fd44
      SOURCE_AUTHORING_ANCHOR: 450b33c5963ba2b202e923b52cbc47a9b11d6db7
      F7B0_AUTHORING_TASK_SHA256: fb03ded3feeb76610a04ff25cec3aa1acdc5c1048ce7adb7852d6510933571a2
      F7B3_HOSTED_AUTHORIZATION_SHA256: 498de71c3b285b41636e415f36dbeca9346998167e4ac253a17a69ced86b0215

    steps:
      - name: Reject mismatched discovery context before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${GITHUB_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${GITHUB_EVENT_NAME}" == "${EXPECTED_EVENT_NAME}" ]]
          [[ "${GITHUB_REF}" == "${EXPECTED_EVENT_REF}" ]]
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]
          [[ "${GITHUB_ACTOR}" == "${EXPECTED_ACTOR_LOGIN}" ]]
          [[ "${GITHUB_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EXPECTED_EVENT_ACTION}" == "labeled" ]]
          [[ "${EXPECTED_LABEL}" == "p0-v2-discovery" ]]
          [[ "${EXPECTED_SENDER_LOGIN}" == "${EXPECTED_ACTOR_LOGIN}" ]]
          [[ "${EXPECTED_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EXPECTED_PR_NUMBER}" == "71" ]]
          [[ "${EXPECTED_HEAD_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_HEAD_BRANCH}" == "agent/issue-70-p0-v2-feasibility-gate1" ]]
          [[ "${EXPECTED_BASE_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_BASE_REF}" == "main" ]]
          [[ "${EVENT_BASE_SHA}" == "${EXPECTED_BASE_SHA}" ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_WORKFLOW_REF}" == \
            "${EXPECTED_REPOSITORY}/${EXPECTED_WORKFLOW_PATH}@${GITHUB_REF}" ]]
          [[ "${EXPECTED_PROBE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_SCHEMA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_TEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_DISCOVERY_SCHEMA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${SOURCE_AUTHORING_ANCHOR}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${F7B0_AUTHORING_TASK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${F7B3_HOSTED_AUTHORIZATION_SHA256}" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out exact discovery head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind reviewed Git objects and stage immutable root inputs
        shell: bash
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          observed_head="$(git rev-parse HEAD)"
          [[ "${observed_head}" == "${EXPECTED_HEAD_SHA}" ]]
          [[ "${EVENT_BASE_SHA}" == "${EXPECTED_BASE_SHA}" ]]
          [[ "$(git rev-parse --show-object-format)" == "sha1" ]]
          mapfile -t replacement_refs < <(
            git for-each-ref --format='%(refname)' refs/replace/
          )
          [[ "${#replacement_refs[@]}" -eq 0 ]]
          graft_path="$(git rev-parse --git-path info/grafts)"
          [[ ! -e "${graft_path}" ]]
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" "${observed_head}"
          git fetch --no-tags --depth=1 origin "${EXPECTED_MERGE_SHA}"
          [[ "$(git cat-file -t "${EXPECTED_MERGE_SHA}")" == "commit" ]]
          observed_head_tree="$(git rev-parse "${observed_head}^{tree}")"
          merge_commit_raw="$(
            mktemp "${RUNNER_TEMP}/p0-v2-merge-commit.XXXXXXXX"
          )"
          git cat-file commit "${EXPECTED_MERGE_SHA}" > "${merge_commit_raw}"
          /usr/bin/python3 -I - \
            "${merge_commit_raw}" \
            "${EXPECTED_MERGE_SHA}" \
            "${EXPECTED_BASE_SHA}" \
            "${observed_head}" \
            "${observed_head_tree}" <<'PY'
          # BEGIN_F7B2_RAW_COMMIT_PARSER
          import hashlib
          import re
          import sys

          raw_path, expected_sha, expected_base, expected_head, expected_tree = (
              sys.argv[1:]
          )
          with open(raw_path, "rb") as handle:
              raw = handle.read()
          if b"\0" in raw or b"\r" in raw:
              raise SystemExit("forbidden byte in raw commit")
          actual_sha = hashlib.sha1(
              b"commit " + str(len(raw)).encode("ascii") + b"\0" + raw
          ).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit("raw commit SHA-1 mismatch")
          header, separator, _message = raw.partition(b"\n\n")
          if not separator:
              raise SystemExit("missing commit header/body separator")
          lines = header.split(b"\n")
          if len(lines) < 5:
              raise SystemExit("incomplete commit header")
          tree_match = re.fullmatch(rb"tree ([0-9a-f]{40})", lines[0])
          if tree_match is None:
              raise SystemExit("invalid or misplaced tree header")
          if tree_match.group(1).decode("ascii") != expected_tree:
              raise SystemExit("merge tree does not equal head tree")
          expected_parents = [
              f"parent {expected_base}".encode("ascii"),
              f"parent {expected_head}".encode("ascii"),
          ]
          if lines[1:3] != expected_parents:
              raise SystemExit("ordered merge parents mismatch")
          active_key = None
          top_level_keys = []
          for line in lines[3:]:
              if line.startswith(b" "):
                  if active_key not in {b"gpgsig", b"mergetag"}:
                      raise SystemExit("invalid commit header continuation")
                  continue
              match = re.fullmatch(rb"([a-z][a-z0-9-]*) (.+)", line)
              if match is None:
                  raise SystemExit("malformed commit header")
              active_key = match.group(1)
              if active_key in {b"tree", b"parent"}:
                  raise SystemExit("extra structural commit header")
              top_level_keys.append(active_key)
          if top_level_keys.count(b"author") != 1:
              raise SystemExit("invalid author header count")
          if top_level_keys.count(b"committer") != 1:
              raise SystemExit("invalid committer header count")
          if top_level_keys.index(b"author") > top_level_keys.index(b"committer"):
              raise SystemExit("author/committer header order mismatch")
          # END_F7B2_RAW_COMMIT_PARSER
          PY
          rm -f "${merge_commit_raw}"

          workflow_blob="$(
            git rev-parse "${EXPECTED_WORKFLOW_SHA}:${EXPECTED_WORKFLOW_PATH}"
          )"
          merge_blob="$(
            git rev-parse "${EXPECTED_MERGE_SHA}:${EXPECTED_WORKFLOW_PATH}"
          )"
          head_blob="$(
            git rev-parse "${EXPECTED_HEAD_SHA}:${EXPECTED_WORKFLOW_PATH}"
          )"
          [[ "${workflow_blob}" == "${merge_blob}" ]]
          [[ "${merge_blob}" == "${head_blob}" ]]

          expected_paths=(
            ".github/workflows/p0-v2-runner-feasibility.yml"
            "contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json"
            "tests/test_b3_p0_v2_runner_feasibility.py"
            "tools/p0_v2_runner_probe.py"
          )
          mapfile -t changed_records < <(
            git diff --name-status --no-renames "${EXPECTED_BASE_SHA}" "${observed_head}"
          )
          [[ "${#changed_records[@]}" -eq 4 ]]
          expected_records=()
          for path in "${expected_paths[@]}"; do
            expected_records+=($'A\t'"${path}")
          done
          mapfile -t expected_sorted < <(
            printf '%s\n' "${expected_records[@]}" | LC_ALL=C sort
          )
          mapfile -t observed_sorted < <(
            printf '%s\n' "${changed_records[@]}" | LC_ALL=C sort
          )
          [[ "$(printf '%s\n' "${expected_sorted[@]}")" == \
            "$(printf '%s\n' "${observed_sorted[@]}")" ]]
          for path in "${expected_paths[@]}"; do
            tree_entry="$(git ls-tree "${observed_head}" -- "${path}")"
            [[ "${tree_entry}" =~ ^100644\ blob\ [0-9a-f]{40}$'\t'"${path}"$ ]]
          done
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          [[ "$(sha256sum tools/p0_v2_runner_probe.py | cut -d' ' -f1)" == \
            "${EXPECTED_PROBE_SHA256}" ]]
          [[ "$(sha256sum \
            contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json |
            cut -d' ' -f1)" == "${EXPECTED_SCHEMA_SHA256}" ]]
          [[ "$(sha256sum tests/test_b3_p0_v2_runner_feasibility.py |
            cut -d' ' -f1)" == "${EXPECTED_TEST_SHA256}" ]]

          /usr/bin/python3 -I - "${RUNNER_TEMP}" <<'PY'
          import os
          import stat
          import sys

          path = os.path.abspath(sys.argv[1])
          current = os.sep
          for component in path.split(os.sep)[1:]:
              current = os.path.join(current, component)
              info = os.lstat(current)
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode):
                  raise SystemExit(f"unsafe RUNNER_TEMP component: {current}")
          PY

          trusted_stage="$(
            sudo -n /usr/bin/mktemp -d \
              "${RUNNER_TEMP}/p0-v2-discovery-stage.XXXXXXXX"
          )"
          evidence_dir="$(
            sudo -n /usr/bin/mktemp -d \
              "${RUNNER_TEMP}/p0-v2-discovery-evidence.XXXXXXXX"
          )"
          sudo -n /usr/bin/chown root:root "${trusted_stage}" "${evidence_dir}"
          sudo -n /usr/bin/chmod 0700 "${trusted_stage}" "${evidence_dir}"
          sudo -n /usr/bin/install -o root -g root -m 0444 \
            tools/p0_v2_runner_probe.py \
            "${trusted_stage}/p0_v2_runner_probe.py"
          sudo -n /usr/bin/install -o root -g root -m 0444 \
            contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json \
            "${trusted_stage}/p0-v2-runner-feasibility-evidence.v1.schema.json"
          sudo -n /usr/bin/install -o root -g root -m 0444 \
            tests/test_b3_p0_v2_runner_feasibility.py \
            "${trusted_stage}/test_b3_p0_v2_runner_feasibility.py"
          sudo -n /usr/bin/install -o root -g root -m 0444 \
            "${EXPECTED_WORKFLOW_PATH}" \
            "${trusted_stage}/p0-v2-runner-feasibility.yml"
          sudo -n /usr/bin/chmod 0555 "${trusted_stage}"

          [[ "$(sudo -n /usr/bin/sha256sum \
            "${trusted_stage}/p0_v2_runner_probe.py" | cut -d' ' -f1)" == \
            "${EXPECTED_PROBE_SHA256}" ]]
          [[ "$(sudo -n /usr/bin/sha256sum \
            "${trusted_stage}/p0-v2-runner-feasibility-evidence.v1.schema.json" |
            cut -d' ' -f1)" == "${EXPECTED_SCHEMA_SHA256}" ]]
          [[ "$(sudo -n /usr/bin/sha256sum \
            "${trusted_stage}/test_b3_p0_v2_runner_feasibility.py" |
            cut -d' ' -f1)" == "${EXPECTED_TEST_SHA256}" ]]
          [[ "$(git hash-object \
            "${trusted_stage}/p0-v2-runner-feasibility.yml")" == \
            "${head_blob}" ]]
          workflow_raw_sha256="$(
            sha256sum "${trusted_stage}/p0-v2-runner-feasibility.yml" |
              cut -d' ' -f1
          )"

          printf 'P0_V2_TRUSTED_STAGE=%s\n' "${trusted_stage}" >> "${GITHUB_ENV}"
          printf 'P0_V2_DISCOVERY_EVIDENCE_DIR=%s\n' "${evidence_dir}" >> "${GITHUB_ENV}"
          printf 'P0_V2_WORKFLOW_RAW_SHA256=%s\n' \
            "${workflow_raw_sha256}" >> "${GITHUB_ENV}"

      - name: Execute proof-ineligible immutable discovery
        id: discovery-probe
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          [[ -n "${ImageOS:-}" ]]
          [[ -n "${ImageVersion:-}" ]]
          image_build="${ImageVersion%.*}"
          [[ -n "${image_build}" && "${image_build}" != "${ImageVersion}" ]]
          image_release="https://github.com/actions/runner-images/releases/tag/${ImageOS}%2F${image_build}"

          sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            /usr/bin/python3 -I \
            "${P0_V2_TRUSTED_STAGE}/p0_v2_runner_probe.py" discover \
            --repository-id "${GITHUB_REPOSITORY_ID}" \
            --pr-number "${EXPECTED_PR_NUMBER}" \
            --event-name "${EXPECTED_EVENT_NAME}" \
            --event-action "${EXPECTED_EVENT_ACTION}" \
            --event-ref "${EXPECTED_EVENT_REF}" \
            --label "${EXPECTED_LABEL}" \
            --sender-login "${EXPECTED_SENDER_LOGIN}" \
            --sender-id "${EXPECTED_SENDER_ID}" \
            --actor-login "${EXPECTED_ACTOR_LOGIN}" \
            --actor-id "${EXPECTED_ACTOR_ID}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --head-sha "${EXPECTED_HEAD_SHA}" \
            --base-sha "${EXPECTED_BASE_SHA}" \
            --merge-sha "${EXPECTED_MERGE_SHA}" \
            --repository "${EXPECTED_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}" \
            --workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --workflow-file \
              "${P0_V2_TRUSTED_STAGE}/p0-v2-runner-feasibility.yml" \
            --test-file \
              "${P0_V2_TRUSTED_STAGE}/test_b3_p0_v2_runner_feasibility.py" \
            --runner-label "ubuntu-24.04" \
            --image-os "${ImageOS}" \
            --image-version "${ImageVersion}" \
            --image-release "${image_release}" \
            --runner-arch "${RUNNER_ARCH}" \
            --source-path \
              "${P0_V2_TRUSTED_STAGE}/p0_v2_runner_probe.py" \
            --schema-path \
              "${P0_V2_TRUSTED_STAGE}/p0-v2-runner-feasibility-evidence.v1.schema.json" \
            --implementation-commit "${EXPECTED_HEAD_SHA}" \
            --source-authoring-anchor "${SOURCE_AUTHORING_ANCHOR}" \
            --f7b0-authoring-task-sha256 "${F7B0_AUTHORING_TASK_SHA256}" \
            --f7b3-hosted-authorization-sha256 \
              "${F7B3_HOSTED_AUTHORIZATION_SHA256}" \
            --evidence-dir "${P0_V2_DISCOVERY_EVIDENCE_DIR}" \
            --evidence-uid 0 \
            --evidence-gid 0

          sudo -n /usr/bin/chown root:root \
            "${P0_V2_DISCOVERY_EVIDENCE_DIR}/discovery-evidence.json" \
            "${P0_V2_DISCOVERY_EVIDENCE_DIR}/discovery-evidence.json.manifest.json"
          sudo -n /usr/bin/chmod 0444 \
            "${P0_V2_DISCOVERY_EVIDENCE_DIR}/discovery-evidence.json" \
            "${P0_V2_DISCOVERY_EVIDENCE_DIR}/discovery-evidence.json.manifest.json"
          sudo -n /usr/bin/chmod 0555 "${P0_V2_DISCOVERY_EVIDENCE_DIR}"

      - name: Independently verify sealed discovery paths before upload
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - \
            "${P0_V2_DISCOVERY_EVIDENCE_DIR}" \
            "${EXPECTED_REPOSITORY}" \
            "${GITHUB_REPOSITORY_ID}" \
            "${EXPECTED_HEAD_SHA}" \
            "${EXPECTED_BASE_SHA}" \
            "${EXPECTED_MERGE_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${EXPECTED_WORKFLOW_REF}" \
            "${EXPECTED_WORKFLOW_SHA}" \
            "${EXPECTED_PROBE_SHA256}" \
            "${EXPECTED_SCHEMA_SHA256}" \
            "${EXPECTED_TEST_SHA256}" \
            "${P0_V2_WORKFLOW_RAW_SHA256}" \
            "${EXPECTED_DISCOVERY_SCHEMA_SHA256}" \
            "${SOURCE_AUTHORING_ANCHOR}" \
            "${F7B0_AUTHORING_TASK_SHA256}" \
            "${F7B3_HOSTED_AUTHORIZATION_SHA256}" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys

          (
              directory,
              repository,
              repository_id,
              head_sha,
              base_sha,
              merge_sha,
              run_id,
              run_attempt,
              workflow_ref,
              workflow_sha,
              probe_sha256,
              schema_sha256,
              test_sha256,
              workflow_sha256,
              discovery_schema_sha256,
              source_anchor,
              f7b0_sha256,
              f7b3_sha256,
          ) = sys.argv[1:]

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def load_json(raw):
              return json.loads(raw, object_pairs_hook=reject_duplicates)

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          directory_info = os.lstat(directory)
          if (
              not stat.S_ISDIR(directory_info.st_mode)
              or stat.S_IMODE(directory_info.st_mode) != 0o555
              or directory_info.st_uid != 0
              or directory_info.st_gid != 0
          ):
              raise SystemExit("unsealed discovery directory")
          expected_names = [
              "discovery-evidence.json",
              "discovery-evidence.json.manifest.json",
          ]
          if sorted(os.listdir(directory)) != expected_names:
              raise SystemExit("unexpected discovery directory entries")
          raw = {}
          for name in expected_names:
              path = os.path.join(directory, name)
              info = os.lstat(path)
              if (
                  not stat.S_ISREG(info.st_mode)
                  or stat.S_IMODE(info.st_mode) != 0o444
                  or info.st_uid != 0
                  or info.st_gid != 0
                  or info.st_nlink != 1
                  or info.st_size <= 0
                  or info.st_size > 1_310_720
              ):
                  raise SystemExit(f"unsafe sealed file: {name}")
              with open(path, "rb") as handle:
                  raw[name] = handle.read()

          evidence = load_json(raw["discovery-evidence.json"])
          manifest = load_json(
              raw["discovery-evidence.json.manifest.json"]
          )
          if raw["discovery-evidence.json"] != canonical(evidence):
              raise SystemExit("non-canonical discovery JSON")
          if raw["discovery-evidence.json.manifest.json"] != canonical(manifest):
              raise SystemExit("non-canonical discovery manifest")

          expected_top = {
              "schema_version",
              "evidence_kind",
              "discovery_notice",
              "mode",
              "outcome",
              "outcome_authority",
              "proof_eligible",
              "proof_ineligible_reason",
              "identity",
              "source",
              "records",
              "future_witnesses",
              "mandatory_effect_blockers",
              "errors",
          }
          if set(evidence) != expected_top:
              raise SystemExit("unexpected discovery top-level fields")
          identity = evidence["identity"]
          source = evidence["source"]
          expected_identity = {
              "repository": repository,
              "repository_id": repository_id,
              "pr_number": "71",
              "event_name": "pull_request",
              "event_action": "labeled",
              "event_ref": "refs/pull/71/merge",
              "label": "p0-v2-discovery",
              "sender_login": "yurikuchumov-ux",
              "sender_id": "299144523",
              "actor_login": "yurikuchumov-ux",
              "actor_id": "299144523",
              "run_id": run_id,
              "run_attempt": run_attempt,
              "head_sha": head_sha,
              "base_sha": base_sha,
              "merge_sha": merge_sha,
              "workflow_ref": workflow_ref,
              "workflow_sha": workflow_sha,
          }
          for key, expected in expected_identity.items():
              if identity.get(key) != expected:
                  raise SystemExit(f"identity mismatch: {key}")
          expected_source = {
              "probe_sha256": probe_sha256,
              "schema_sha256": schema_sha256,
              "test_sha256": test_sha256,
              "workflow_sha256": workflow_sha256,
              "discovery_schema_sha256": discovery_schema_sha256,
              "implementation_commit": head_sha,
              "source_authoring_anchor": source_anchor,
              "f7b0_authoring_task_sha256": f7b0_sha256,
              "f7b3_hosted_authorization_sha256": f7b3_sha256,
          }
          for key, expected in expected_source.items():
              if source.get(key) != expected:
                  raise SystemExit(f"source mismatch: {key}")
          if (
              evidence["schema_version"] != "2.0.0"
              or evidence["evidence_kind"]
              != "p0-v2-runner-feasibility-discovery"
              or evidence["mode"] != "hosted_discovery"
              or evidence["outcome"] != "DISCOVERY_ONLY"
              or evidence["proof_eligible"] is not False
              or len(evidence["records"]) != 9
              or len(evidence["mandatory_effect_blockers"]) != 27
          ):
              raise SystemExit("proof-ineligible contract mismatch")
          if [item.get("sequence") for item in evidence["records"]] != list(
              range(9)
          ):
              raise SystemExit("non-canonical discovery sequence")
          expected_surfaces = [
              "runner_image",
              "kernel",
              "systemd",
              "cgroup_topology",
              "mountinfo_topology",
              "bpf_prog_query",
              "device_nodes",
              "executable_abis",
              "field_availability",
          ]
          if [
              item.get("surface") for item in evidence["records"]
          ] != expected_surfaces:
              raise SystemExit("non-canonical discovery surfaces")
          field_value = evidence["records"][8].get("value")
          expected_root_observations = [
              {
                  "name": "cgroup.controllers",
                  "path": "/sys/fs/cgroup/cgroup.controllers",
                  "scope": "observed_cgroup2_mount_root",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "cgroup.subtree_control",
                  "path": "/sys/fs/cgroup/cgroup.subtree_control",
                  "scope": "observed_cgroup2_mount_root",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "etc.os-release",
                  "path": "/etc/os-release",
                  "scope": "observed_filesystem_root",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "kernel.core_pattern",
                  "path": "/proc/sys/kernel/core_pattern",
                  "scope": "observed_procfs_namespace",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "proc.cgroup",
                  "path": "/proc/self/cgroup",
                  "scope": "observed_procfs_namespace",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "proc.mountinfo",
                  "path": "/proc/self/mountinfo",
                  "scope": "observed_procfs_namespace",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
              {
                  "name": "proc.status",
                  "path": "/proc/self/status",
                  "scope": "observed_procfs_namespace",
                  "access": "read_only",
                  "attempted": True,
                  "available": True,
                  "errno": None,
              },
          ]
          expected_deferred_surfaces = [
              {
                  "name": "cgroup.events",
                  "scope": "future_identity_bound_non_root_cgroup",
                  "disposition": "non_root_read_deferred",
                  "reason": "kernel_non_root_interface",
                  "controller": None,
                  "attempted": False,
                  "future_availability_claim": "none",
                  "proof_eligible": False,
              },
              {
                  "name": "cgroup.kill",
                  "scope": "future_identity_bound_non_root_cgroup",
                  "disposition": "non_root_destructive_deferred",
                  "reason": (
                      "write_only_kill_authority_requires_identity_bound_runtime"
                  ),
                  "controller": None,
                  "attempted": False,
                  "future_availability_claim": "none",
                  "proof_eligible": False,
              },
              {
                  "name": "cpu.max",
                  "scope": "future_identity_bound_non_root_cgroup",
                  "disposition": "non_root_controller_deferred",
                  "reason": (
                      "controller_interface_requires_identity_bound_runtime"
                  ),
                  "controller": "cpu",
                  "attempted": False,
                  "future_availability_claim": "none",
                  "proof_eligible": False,
              },
              {
                  "name": "memory.events",
                  "scope": "future_identity_bound_non_root_cgroup",
                  "disposition": "non_root_controller_deferred",
                  "reason": (
                      "controller_interface_requires_identity_bound_runtime"
                  ),
                  "controller": "memory",
                  "attempted": False,
                  "future_availability_claim": "none",
                  "proof_eligible": False,
              },
              {
                  "name": "memory.oom.group",
                  "scope": "future_identity_bound_non_root_cgroup",
                  "disposition": "non_root_controller_deferred",
                  "reason": (
                      "controller_interface_requires_identity_bound_runtime"
                  ),
                  "controller": "memory",
                  "attempted": False,
                  "future_availability_claim": "none",
                  "proof_eligible": False,
              },
          ]
          if field_value != {
              "root_observations": expected_root_observations,
              "deferred_surfaces": expected_deferred_surfaces,
          }:
              raise SystemExit("field availability model mismatch")
          if any(
              item.get("proof_eligible") is not False
              for item in evidence["future_witnesses"]
          ):
              raise SystemExit("future witness overclaim")
          rendered = raw["discovery-evidence.json"].decode("utf-8")
          if "GATE1_" in rendered or '"outcome":"SUCCESS"' in rendered:
              raise SystemExit("forged candidate/reviewer authority")

          evidence_digest = hashlib.sha256(
              raw["discovery-evidence.json"]
          ).hexdigest()
          if (
              manifest.get("manifest_version") != "1.0.0"
              or manifest.get("evidence_kind")
              != "p0-v2-runner-feasibility-discovery"
              or manifest.get("evidence_file")
              != "discovery-evidence.json"
              or manifest.get("evidence_sha256") != evidence_digest
              or manifest.get("identity") != identity
              or manifest.get("source") != source
              or manifest.get("proof_eligible") is not False
          ):
              raise SystemExit("manifest binding mismatch")
          PY

      - name: Upload sealed proof-ineligible discovery evidence
        id: discovery-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-v2-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.P0_V2_DISCOVERY_EVIDENCE_DIR }}/discovery-evidence.json
            ${{ env.P0_V2_DISCOVERY_EVIDENCE_DIR }}/discovery-evidence.json.manifest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  gate1:
    if: >-
      always() &&
      github.repository == 'yurikuchumov-ux/ai-operating-system' &&
      github.event.pull_request.number == 71 &&
      github.event.pull_request.head.repo.full_name == 'yurikuchumov-ux/ai-operating-system' &&
      github.event.pull_request.head.ref == 'agent/issue-70-p0-v2-feasibility-gate1' &&
      github.event.pull_request.base.repo.full_name == 'yurikuchumov-ux/ai-operating-system' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == 'd4f10b714de3afae84d48dfcd3daa6405092a973' &&
      (
        github.event.action == 'ready_for_review' ||
        github.event.action == 'reopened' ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'p0-v2-cancel-canary'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_REPOSITORY: yurikuchumov-ux/ai-operating-system
      EXPECTED_PR_NUMBER: "71"
      EXPECTED_EVENT_ACTION: ${{ github.event.action }}
      EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_MERGE_SHA: ${{ github.sha }}
      EXPECTED_BASE_SHA: d4f10b714de3afae84d48dfcd3daa6405092a973
      EXPECTED_WORKFLOW_PATH: .github/workflows/p0-v2-runner-feasibility.yml
      EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CONTROL_TASK_COMMIT: e0587c2e3134c30f761206689191f6de822c491a
      CONTROL_TASK_SHA256: 0886b8125c66d3ad9fa22f271978ebc3e8cab726cacbaff0cab65caf0e604934
      CANCEL_CANARY: ${{ github.event.action == 'labeled' && github.event.label.name == 'p0-v2-cancel-canary' }}

    steps:
      - name: Reject mismatched GitHub context before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_PR_NUMBER}" == "71" ]]
          [[ "${EXPECTED_HEAD_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_HEAD_BRANCH}" == "agent/issue-70-p0-v2-feasibility-gate1" ]]
          [[ "${EXPECTED_BASE_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_BASE_REF}" == "main" ]]
          [[ "${EVENT_BASE_SHA}" == "${EXPECTED_BASE_SHA}" ]]
          case "${EXPECTED_EVENT_ACTION}:${CANCEL_CANARY}" in
            ready_for_review:false|reopened:false|labeled:true) ;;
            *) exit 1 ;;
          esac
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_WORKFLOW_REF}" == "${EXPECTED_REPOSITORY}/${EXPECTED_WORKFLOW_PATH}@"* ]]
          [[ "${EXPECTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTROL_TASK_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTROL_TASK_SHA256}" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out the exact same-repository PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind checkout and change scope before sudo
        shell: bash
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          observed_head="$(git rev-parse HEAD)"
          [[ "${observed_head}" == "${EXPECTED_HEAD_SHA}" ]]
          [[ "${EXPECTED_BASE_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EXPECTED_BASE_REF}" == "main" ]]
          [[ "${EVENT_BASE_SHA}" == "${EXPECTED_BASE_SHA}" ]]
          [[ "$(git rev-parse --show-object-format)" == "sha1" ]]
          mapfile -t replacement_refs < <(
            git for-each-ref --format='%(refname)' refs/replace/
          )
          [[ "${#replacement_refs[@]}" -eq 0 ]]
          graft_path="$(git rev-parse --git-path info/grafts)"
          [[ ! -e "${graft_path}" ]]
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" "${observed_head}"
          git fetch --no-tags --depth=1 origin "${EXPECTED_MERGE_SHA}"
          [[ "$(git cat-file -t "${EXPECTED_MERGE_SHA}")" == "commit" ]]
          observed_head_tree="$(git rev-parse "${observed_head}^{tree}")"
          merge_commit_raw="$(
            mktemp "${RUNNER_TEMP}/p0-v2-merge-commit.XXXXXXXX"
          )"
          git cat-file commit "${EXPECTED_MERGE_SHA}" > "${merge_commit_raw}"
          /usr/bin/python3 -I - \
            "${merge_commit_raw}" \
            "${EXPECTED_MERGE_SHA}" \
            "${EXPECTED_BASE_SHA}" \
            "${observed_head}" \
            "${observed_head_tree}" <<'PY'
          # BEGIN_F7B2_RAW_COMMIT_PARSER
          import hashlib
          import re
          import sys

          raw_path, expected_sha, expected_base, expected_head, expected_tree = (
              sys.argv[1:]
          )
          with open(raw_path, "rb") as handle:
              raw = handle.read()
          if b"\0" in raw or b"\r" in raw:
              raise SystemExit("forbidden byte in raw commit")
          actual_sha = hashlib.sha1(
              b"commit " + str(len(raw)).encode("ascii") + b"\0" + raw
          ).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit("raw commit SHA-1 mismatch")
          header, separator, _message = raw.partition(b"\n\n")
          if not separator:
              raise SystemExit("missing commit header/body separator")
          lines = header.split(b"\n")
          if len(lines) < 5:
              raise SystemExit("incomplete commit header")
          tree_match = re.fullmatch(rb"tree ([0-9a-f]{40})", lines[0])
          if tree_match is None:
              raise SystemExit("invalid or misplaced tree header")
          if tree_match.group(1).decode("ascii") != expected_tree:
              raise SystemExit("merge tree does not equal head tree")
          expected_parents = [
              f"parent {expected_base}".encode("ascii"),
              f"parent {expected_head}".encode("ascii"),
          ]
          if lines[1:3] != expected_parents:
              raise SystemExit("ordered merge parents mismatch")
          active_key = None
          top_level_keys = []
          for line in lines[3:]:
              if line.startswith(b" "):
                  if active_key not in {b"gpgsig", b"mergetag"}:
                      raise SystemExit("invalid commit header continuation")
                  continue
              match = re.fullmatch(rb"([a-z][a-z0-9-]*) (.+)", line)
              if match is None:
                  raise SystemExit("malformed commit header")
              active_key = match.group(1)
              if active_key in {b"tree", b"parent"}:
                  raise SystemExit("extra structural commit header")
              top_level_keys.append(active_key)
          if top_level_keys.count(b"author") != 1:
              raise SystemExit("invalid author header count")
          if top_level_keys.count(b"committer") != 1:
              raise SystemExit("invalid committer header count")
          if top_level_keys.index(b"author") > top_level_keys.index(b"committer"):
              raise SystemExit("author/committer header order mismatch")
          # END_F7B2_RAW_COMMIT_PARSER
          PY
          rm -f "${merge_commit_raw}"
          mapfile -t changed_records < <(
            git diff --name-status --no-renames "${EXPECTED_BASE_SHA}" "${observed_head}"
          )
          [[ "${#changed_records[@]}" -eq 4 ]]
          expected_paths=(
            ".github/workflows/p0-v2-runner-feasibility.yml"
            "contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json"
            "tests/test_b3_p0_v2_runner_feasibility.py"
            "tools/p0_v2_runner_probe.py"
          )
          expected_records=()
          for path in "${expected_paths[@]}"; do
            expected_records+=($'A\t'"${path}")
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_records[@]}" | LC_ALL=C sort)
          mapfile -t observed_sorted < <(printf '%s\n' "${changed_records[@]}" | LC_ALL=C sort)
          [[ "$(printf '%s\n' "${expected_sorted[@]}")" == "$(printf '%s\n' "${observed_sorted[@]}")" ]]
          for path in "${expected_paths[@]}"; do
            tree_entry="$(git ls-tree "${observed_head}" -- "${path}")"
            [[ "${tree_entry}" =~ ^100644\ blob\ [0-9a-f]{40}$'\t'"${path}"$ ]]
          done
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run deterministic Gate 1 contract tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -p 'test_b3_p0_v2_runner_feasibility.py'

      - name: Prepare trusted evidence destination
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/p0-v2-gate1-evidence"
          install -d -m 0700 "${evidence_dir}"
          printf 'P0_V2_EVIDENCE_DIR=%s\n' "${evidence_dir}" >> "${GITHUB_ENV}"
          printf 'P0_V2_RUNNER_UID=%s\n' "$(id -u)" >> "${GITHUB_ENV}"
          printf 'P0_V2_RUNNER_GID=%s\n' "$(id -g)" >> "${GITHUB_ENV}"

      - name: Execute secretless hostile runner probe
        id: hostile-probe
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "${CANCEL_CANARY}" == "true" ]]; then
            extra_args+=(--cancel-canary)
          fi
          sudo -n /usr/bin/python3 -I tools/p0_v2_runner_probe.py supervisor \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --pr-number "${EXPECTED_PR_NUMBER}" \
            --event-action "${EXPECTED_EVENT_ACTION}" \
            --head-sha "${EXPECTED_HEAD_SHA}" \
            --head-repository "${EXPECTED_HEAD_REPOSITORY}" \
            --head-ref "${EXPECTED_HEAD_BRANCH}" \
            --base-sha "${EXPECTED_BASE_SHA}" \
            --base-repository "${EXPECTED_BASE_REPOSITORY}" \
            --base-ref "${EXPECTED_BASE_REF}" \
            --merge-sha "${EXPECTED_MERGE_SHA}" \
            --repository "${EXPECTED_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}" \
            --workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --workflow-file "${GITHUB_WORKSPACE}/${EXPECTED_WORKFLOW_PATH}" \
            --test-file "${GITHUB_WORKSPACE}/tests/test_b3_p0_v2_runner_feasibility.py" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --runner-image "${ImageOS:-ubuntu24}" \
            --runner-arch "${RUNNER_ARCH}" \
            --source-path "${GITHUB_WORKSPACE}/tools/p0_v2_runner_probe.py" \
            --schema-path "${GITHUB_WORKSPACE}/contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json" \
            --evidence-dir "${P0_V2_EVIDENCE_DIR}" \
            --evidence-uid "${P0_V2_RUNNER_UID}" \
            --evidence-gid "${P0_V2_RUNNER_GID}" \
            "${extra_args[@]}"

      - name: Same-VM ordinary-cancellation finalizer
        if: always() && cancelled()
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I tools/p0_v2_runner_probe.py finalize \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --pr-number "${EXPECTED_PR_NUMBER}" \
            --event-action "${EXPECTED_EVENT_ACTION}" \
            --head-sha "${EXPECTED_HEAD_SHA}" \
            --head-repository "${EXPECTED_HEAD_REPOSITORY}" \
            --head-ref "${EXPECTED_HEAD_BRANCH}" \
            --base-sha "${EXPECTED_BASE_SHA}" \
            --base-repository "${EXPECTED_BASE_REPOSITORY}" \
            --base-ref "${EXPECTED_BASE_REF}" \
            --merge-sha "${EXPECTED_MERGE_SHA}" \
            --repository "${EXPECTED_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}" \
            --workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --workflow-file "${GITHUB_WORKSPACE}/${EXPECTED_WORKFLOW_PATH}" \
            --test-file "${GITHUB_WORKSPACE}/tests/test_b3_p0_v2_runner_feasibility.py" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --runner-image "${ImageOS:-ubuntu24}" \
            --runner-arch "${RUNNER_ARCH}" \
            --source-path "${GITHUB_WORKSPACE}/tools/p0_v2_runner_probe.py" \
            --schema-path "${GITHUB_WORKSPACE}/contracts/schemas/p0-v2-runner-feasibility-evidence.v1.schema.json" \
            --evidence-dir "${P0_V2_EVIDENCE_DIR}" \
            --evidence-uid "${P0_V2_RUNNER_UID}" \
            --evidence-gid "${P0_V2_RUNNER_GID}"

      - name: Upload canonical candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-v2-gate1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.P0_V2_EVIDENCE_DIR }}/candidate-evidence.json
            ${{ env.P0_V2_EVIDENCE_DIR }}/candidate-evidence.json.manifest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
